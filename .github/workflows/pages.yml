name: Pages

# Publishes the playground to https://wheevu.github.io/muninn/.
#
# The page runs the interpreter in the reader's tab, so there is no server in
# this workflow and none in the artifact: a folder of static files plus one
# WebAssembly module built from the same commit as the page.
#
# Repository Pages has to be enabled once with "GitHub Actions" as the source
# before this can deploy. That step is manual: configure-pages can do it only
# with a token other than GITHUB_TOKEN, so it is used here for metadata only.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build_site_wasm.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Top level, not per job, and deliberately so. A job-level permissions block
# replaces this one instead of merging with it, and anything it omits is set
# to none, which would leave actions/checkout unable to clone the repository.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            wasm -> wasm/target

      - name: Build the interpreter for the page
        run: ./scripts/build_site_wasm.sh

      # The page shows the output of a real interpreter, so a module that is
      # missing, empty, or an HTML error page from a failed download fails the
      # build here rather than reaching a reader as an editor that never runs.
      - name: Check the artifact
        run: |
          set -euo pipefail
          for file in site/muninn.wasm site/index.html site/app.js \
            site/worker.js site/style.css site/examples/index.json; do
            test -s "$file" || { echo "missing or empty: $file"; exit 1; }
          done
          for program in euclid records tensors broadcast type-error capability fib; do
            test -s "site/examples/$program.mun" ||
              { echo "missing or empty: site/examples/$program.mun"; exit 1; }
          done
          # Read the WebAssembly magic as hex rather than through `od -c`:
          # GNU od prints \0 where BSD od prints 0, so a character-based match
          # reports a good module as broken on the other platform.
          magic=$(head -c 4 site/muninn.wasm | od -An -t x1 | tr -d ' \n')
          test "$magic" = "0061736d" ||
            { echo "not a WebAssembly module: magic=$magic"; exit 1; }

      # The module is the interpreter, so the same answers the page will draw
      # are checked before it is published: a program runs, one steps, a type
      # error is refused, a denied builtin traps, and a division by zero faults.
      - name: Run the interpreter's own probe
        run: node wasm/probe.cjs site/muninn.wasm

      - name: Stage the page
        run: |
          set -euo pipefail
          # An allowlist rather than copying `site/` and deleting afterwards.
          # The published folder is the page and nothing else; a copy would
          # also publish the browser tests, the npm manifest and the Markdown
          # README to a public URL, and any new test file would leak by default.
          mkdir -p _site/examples
          cp site/index.html site/app.js site/worker.js site/style.css \
            site/muninn.wasm _site/
          cp site/examples/index.json "site/examples/"*.mun _site/examples/
          for stray in README.md tests package.json package-lock.json \
            playwright.config.cjs node_modules test-results; do
            test ! -e "_site/$stray" ||
              { echo "staged something that is not page content: $stray"; exit 1; }
          done
          test -f _site/index.html
          test -f _site/muninn.wasm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
