<svg xmlns="http://www.w3.org/2000/svg" width="980" height="510" viewBox="0 0 980 510" role="img" aria-labelledby="title desc">
  <title id="title">Muninn compiler pipeline</title>
  <desc id="desc">Muninn source moves through lexing, parsing, type checking, bytecode generation, and VM execution, with interpreter and JIT paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#88c0d0"/>
    </marker>
  </defs>
  <rect width="980" height="510" rx="18" fill="#0b0f14"/>
  <rect x="22" y="22" width="936" height="466" rx="10" fill="#121821" stroke="#2e3440"/>
  <text x="48" y="64" fill="#d8dee9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" letter-spacing="0.08em">MUNINN ᚱ</text>
  <text x="48" y="92" fill="#7f8ea3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">statically typed scripts → bytecode → VM / JIT</text>

  <path d="M198 166 H244" fill="none" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360 166 H408" fill="none" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M572 166 H620" fill="none" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M701 200 V226 H850 V250" fill="none" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M490 200 V250" fill="none" stroke="#8fbcbb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M490 318 V340 H348 V360" fill="none" stroke="#88c0d0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M490 318 V340 H632 V360" fill="none" stroke="#b9a7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="62" y="132" width="136" height="68" rx="7" fill="#0f141b" stroke="#88c0d0"/>
    <text x="92" y="161" fill="#88c0d0" font-size="13" font-weight="700">source .mun</text>
    <text x="90" y="183" fill="#7f8ea3" font-size="12">fn gcd(...) {}</text>

    <rect x="244" y="132" width="116" height="68" rx="7" fill="#0f141b" stroke="#7f8ea3"/>
    <text x="281" y="161" fill="#d8dee9" font-size="13" font-weight="700">lex</text>
    <text x="271" y="183" fill="#7f8ea3" font-size="12">tokens</text>

    <rect x="408" y="132" width="164" height="68" rx="7" fill="#0f141b" stroke="#7f8ea3"/>
    <text x="466" y="161" fill="#d8dee9" font-size="13" font-weight="700">parse</text>
    <text x="460" y="183" fill="#7f8ea3" font-size="12">AST</text>

    <rect x="620" y="132" width="162" height="68" rx="7" fill="#0f141b" stroke="#d9b86c"/>
    <text x="654" y="161" fill="#d9b86c" font-size="13" font-weight="700">type check</text>
    <text x="654" y="183" fill="#7f8ea3" font-size="12">typed program</text>

    <rect x="768" y="250" width="164" height="68" rx="7" fill="#0f141b" stroke="#8fbcbb"/>
    <text x="802" y="279" fill="#8fbcbb" font-size="13" font-weight="700">bytecode</text>
    <text x="806" y="301" fill="#7f8ea3" font-size="12">.mubc module</text>

    <rect x="408" y="250" width="164" height="68" rx="7" fill="#0f141b" stroke="#8fbcbb"/>
    <text x="464" y="279" fill="#8fbcbb" font-size="13" font-weight="700">VM</text>
    <text x="434" y="301" fill="#7f8ea3" font-size="12">stack runtime</text>

    <rect x="266" y="360" width="164" height="46" rx="7" fill="#0f141b" stroke="#88c0d0"/>
    <text x="302" y="389" fill="#88c0d0" font-size="13" font-weight="700">interpreter</text>

    <rect x="550" y="360" width="164" height="46" rx="7" fill="#0f141b" stroke="#7c6f9f"/>
    <text x="584" y="389" fill="#b9a7ff" font-size="13" font-weight="700">JIT hot loops</text>
  </g>

  <line x1="48" y1="454" x2="932" y2="454" stroke="#2e3440" stroke-width="1"/>
  <text x="48" y="478" fill="#7f8ea3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ᛗ source carved into types · ᚨ lowered into bytecode · ᚾ run by the VM</text>
</svg>
