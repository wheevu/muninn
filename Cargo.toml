[package]
name = "muninn"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "lsp"]

[dependencies]
cranelift = { version = "0.115", optional = true }
cranelift-jit = { version = "0.115", optional = true }
cranelift-module = { version = "0.115", optional = true }
cranelift-native = { version = "0.115", optional = true }

[features]
default = []
jit = ["dep:cranelift", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "runtime"
harness = false
